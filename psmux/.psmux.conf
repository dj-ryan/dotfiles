# psmux config (Windows)
# Deploy to ~/.psmux.conf; psmux reads it ahead of ~/.tmux.conf.

# -- general -------------------------------------------------------------------

# Pin the shell; otherwise psmux inherits $SHELL (bash when started from Git Bash)
set -g default-shell pwsh

# -- navigation ----------------------------------------------------------------

# Vim-style pane focus, alongside the default <prefix> arrow keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
